# Experiment: B3_D3 — Chaotic swarm + Doctor Seek Sick Centroid
# Row: B3 (noise injection, dispersed — chaotic movement)
# Col: D3 (doctors seek centroid of all infected boids)

[world]
world_width = 1920
world_height = 1080
wall_bounce = true

[population]
initial_normal_count = 200
initial_doctor_count = 10

[infection]
p_initial_infect_normal = 0.1
p_initial_infect_doctor = 0.0
p_infect_normal = 0.3
p_infect_doctor = 0.0

[cure]
p_cure = 0.8
cure_immunity_level = 1.0

[interaction]
r_interact_normal = 30.0
r_interact_doctor = 40.0

[debuffs]
debuff_p_cure_infected = 0.5
debuff_r_interact_doctor_infected = 0.7
debuff_r_interact_normal_infected = 0.8

[movement]
max_speed = 180.0
max_force = 180.0
min_speed = 54.0
separation_weight = 4.5
alignment_weight = 3.5
cohesion_weight = 2.5
separation_radius = 25.0
alignment_radius = 50.0
cohesion_radius = 50.0
fov = 3.14

[behavior]
swarm_behavior = chaotic
noise_factor = 80.0
doctor_behavior = seek_centroid
doctor_seek_radius = 300.0
doctor_seek_weight = 5.0

[headless]
nogui = true
nogui_duration = 300.0

[output]
output_dir = sim-out
