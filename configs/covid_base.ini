# COVID-19 calibrated base config
# Infection parameters calibrated against South Korea first wave (Feb-Apr 2020)
# Time mapping: 1 sim-second = 4 real hours (300s sim = 50 days)
# Doctor behavior: Normal (passive) -- baseline for sweep
# Use as template for Monte Carlo sweep (DIR-010)

[infection]
p_initial_infect_normal = 0.03
p_initial_infect_doctor = 0.0
p_infect_normal = 0.07
p_infect_doctor = 0.0
p_spontaneous_infect = 0.0001

[cure]
p_cure = 0.8
cure_immunity_level = 1.0

[interaction]
r_interact_normal = 20.0
r_interact_doctor = 50.0

[world]
world_width = 1440.0
world_height = 1000.0
wall_bounce = false

[population]
initial_normal_count = 120
initial_doctor_count = 15

[debuffs]
debuff_p_cure_infected = 0.5
debuff_r_interact_doctor_infected = 0.7
debuff_r_interact_normal_infected = 0.8

[normal_swarm]
max_speed = 250.0
max_force = 180.0
min_speed = 150.0
separation_weight = 4.0
alignment_weight = 3.5
cohesion_weight = 2.5
separation_radius = 25.0
alignment_radius = 300.0
cohesion_radius = 300.0
fov = 3.14
noise_factor = 0.0

[doctor_swarm]
behavior = normal
max_speed = 250.0
max_force = 180.0
min_speed = 150.0
separation_weight = 4.5
alignment_weight = 3.5
cohesion_weight = 2.5
separation_radius = 25.0
alignment_radius = 300.0
cohesion_radius = 300.0
fov = 3.14
noise_factor = 0.0
doctor_seek_radius = 0.0
doctor_seek_weight = 5.0

[headless]
nogui = true
nogui_duration = 300.0
csv_sample_interval = 0.5

[output]
output_dir = sim-out
