# COMP6216 Boid Swarm — Default Config (Interactive GUI Mode)
# For experiment presets, see configs/ (9 configs in a 3x3 matrix).
# For the full parameter reference, see include/components.h (SimConfig/SwarmParams structs).

[infection]
p_initial_infect_normal = 0.05
p_initial_infect_doctor = 0.02
p_infect_normal = 0.5
p_infect_doctor = 0.001
p_spontaneous_infect = 0.1

[cure]
p_cure = 0.8
cure_immunity_level = 1.0

[interaction]
r_interact_normal = 30.0
r_interact_doctor = 40.0

[world]
world_width = 1440.0
world_height = 1000.0
wall_bounce = false

[population]
initial_normal_count = 200
initial_doctor_count = 50

[debuffs]
debuff_p_cure_infected = 0.8
debuff_r_interact_doctor_infected = 1
debuff_r_interact_normal_infected = 1

[normal_swarm]
# Formation is controlled by steering params (fov, weights), not a behavior tag
max_speed = 350.0
max_force = 350.0
min_speed = 80.0
separation_weight = 4.0
alignment_weight = 4.0
cohesion_weight = 1.5
separation_radius = 25.0
alignment_radius = 100.0
cohesion_radius = 200.0
fov = 2.80
noise_factor = 0.0

[doctor_swarm]
behavior = nearest
max_speed = 350.0
max_force = 380.0
min_speed = 80.0
separation_weight = 4.0
alignment_weight = 4.0
cohesion_weight = 1.5
separation_radius = 25.0
alignment_radius = 300.0
cohesion_radius = 300.0
fov = 2.6
noise_factor = 0.0
doctor_seek_radius = 300.0
doctor_seek_weight = 5.0

[headless]
nogui = false
nogui_duration = 300.0
csv_sample_interval = 0.0
headless_dt = 0.0

[output]
output_dir = sim-out